name: Security and tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  secret-history-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"

      - name: Install pinned Gitleaks CLI
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Scan all reachable Git history with redacted output
        run: |
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact --no-banner \
            --log-opts="--no-textconv --full-history --all" .

  python-security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install application and audit dependencies
        run: python -m pip install -r requirements.txt pip-audit

      - name: Audit installed Python packages
        run: pip-audit

      - name: Check Python syntax and dependency consistency
        run: |
          python -m compileall -q main.py gateway.py tests
          python -m pip check

      - name: Check frontend JavaScript syntax
        run: node --check app.js

      - name: Run integration tests
        run: python -m unittest discover -s tests -v

      - name: Build production Docker image
        run: docker build --tag voltguard-ci:${{ github.sha }} .
