# Blueprint para demonstração/homologação econômica. Revise planos e preços
# no painel/documentação do Render antes de uma implantação comercial.
services:
  - type: web
    name: hitech-voltguard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voltguard-db
          property: connectionString
      - key: SIMULATE_TELEMETRY
        value: "0"
      - key: ALLOW_SELF_SERVICE_REGISTRATION
        value: "0"

databases:
  - name: voltguard-db
    databaseName: voltguard
    user: voltguard_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
